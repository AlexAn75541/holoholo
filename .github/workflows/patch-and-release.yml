name: Check, Patch and Release Hololive Dreams

on:
  workflow_dispatch:
    inputs:
      xapk_url:
        description: 'Optional direct XAPK URL (blank uses APKPure)'
        required: false
        default: ''
      force_build:
        description: 'Force build even if game version has not changed'
        type: boolean
        default: false
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: patch-release
  cancel-in-progress: false

jobs:
  check-and-fetch:
    name: Fetch and check APK version
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      game_version: ${{ steps.check.outputs.game_version }}
      game_code: ${{ steps.check.outputs.game_code }}
      patch_version: ${{ steps.check.outputs.patch_version }}
      xapk_path: ${{ steps.check.outputs.xapk_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Locate Android SDK build tools
        run: |
          BT_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$BT_DIR/aapt"
          echo "$BT_DIR" >> "$GITHUB_PATH"

      - name: Check version and download source XAPK
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          XAPK_URL: ${{ inputs.xapk_url }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          python3 scripts/check_and_fetch.py --output-xapk source.xapk

      - name: Upload source XAPK artifact
        if: steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: source-xapk
          path: source.xapk
          retention-days: 1

  build-and-release:
    name: Build, verify and publish APK
    needs: check-and-fetch
    if: needs.check-and-fetch.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK build tools
        run: |
          BT_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          for tool in zipalign apksigner aapt; do test -x "$BT_DIR/$tool"; done
          echo "$BT_DIR" >> "$GITHUB_PATH"

      - name: Download source XAPK artifact
        uses: actions/download-artifact@v4
        with:
          name: source-xapk

      - name: Run verifier self-checks
        run: PYTHONPATH=. python3 tests/test_verify_apk.py

      - name: Build signed arm64 APK
        id: patch
        env:
          PATCH_VERSION: ${{ needs.check-and-fetch.outputs.patch_version }}
        run: |
          python3 scripts/patcher.py --input source.xapk --patch-version "$PATCH_VERSION" \
            --keystore keystore/release.p12 --dist-dir dist

      - name: Verify standalone APK
        run: |
          apk=(dist/*.apk)
          test "${#apk[@]}" -eq 1
          python3 scripts/verify_apk.py "${apk[0]}" dist/work/extracted/manifest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK: ${{ steps.patch.outputs.standalone_apk }}
          TAG: ${{ steps.patch.outputs.tag_name }}
          TITLE: ${{ steps.patch.outputs.release_title }}
          GAME_VERSION: ${{ steps.patch.outputs.version_name }}
          GAME_CODE: ${{ steps.patch.outputs.version_code }}
        run: |
          python3 scripts/publish_release.py --apk "$APK" --tag "$TAG" --title "$TITLE" \
            --game-version "$GAME_VERSION" --game-code "$GAME_CODE"

      - name: Prune superseded patch releases
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.patch.outputs.tag_name }}
        run: |
          python3 scripts/prune_releases.py --current-tag "$CURRENT_TAG"
