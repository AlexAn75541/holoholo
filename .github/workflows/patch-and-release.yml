name: Patch and Release Hololive Dreams

on:
  workflow_dispatch:
    inputs:
      xapk_url:
        description: 'Optional direct XAPK URL (blank uses APKPure)'
        required: false
        default: ''
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: patch-release
  cancel-in-progress: false

jobs:
  patch-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android build tools
        run: |
          BT_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$BT_DIR/zipalign"
          test -x "$BT_DIR/apksigner"
          echo "$BT_DIR" >> "$GITHUB_PATH"

      - name: Select patch version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from scripts.patcher import get_apkpure_download_info

          releases = json.loads(subprocess.check_output(
              ['gh', 'release', 'list', '--json', 'tagName', '--limit', '100'], text=True))
          release_tags = [r['tagName'] for r in releases]
          tags = subprocess.check_output(['git', 'tag', '--list'], text=True).splitlines()
          version = '0.1-beta' if '0.1-beta' not in tags else (
              f"0.1.{max([0] + [int(m.group(1)) for t in tags if (m := re.fullmatch(r'0\.1\.(\d+)-beta', t))]) + 1}-beta")

          if os.environ['EVENT_NAME'] == 'schedule':
              _, game_version, game_code = get_apkpure_download_info()
              latest_tag = next((t for t in release_tags if re.fullmatch(r'0\.1(?:\.[1-9][0-9]*)?-beta', t)), None)
              latest_body = subprocess.check_output(
                  ['gh', 'release', 'view', latest_tag, '--json', 'body', '--jq', '.body'], text=True) if latest_tag else ''
              if f'Game version code: `{game_code}`' in latest_body:
                  print('No upstream game update; skipping scheduled build.')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write('skip=true\n')
                  raise SystemExit(0)

          print(f'Patch release: {version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'patch_version={version}\n')
              f.write('skip=false\n')
          PY

      - name: Build signed artifacts
        if: steps.version.outputs.skip != 'true'
        id: patch
        env:
          XAPK_URL: ${{ inputs.xapk_url }}
          PATCH_VERSION: ${{ steps.version.outputs.patch_version }}
        run: |
          args=()
          if [ -n "$XAPK_URL" ]; then args+=(--input "$XAPK_URL"); fi
          python3 scripts/patcher.py "${args[@]}" \
            --patch-version "$PATCH_VERSION" \
            --keystore keystore/release.p12 \
            --dist-dir dist

      - name: Verify APK and XAPK artifacts
        if: steps.version.outputs.skip != 'true'
        run: python3 scripts/verify_apk.py dist

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.patch.outputs.tag_name }}
          name: ${{ steps.patch.outputs.release_title }}
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ steps.patch.outputs.standalone_apk }}
            ${{ steps.patch.outputs.repacked_xapk }}
          body: |
            Patch build `${{ steps.patch.outputs.tag_name }}` (beta, device install and gameplay not yet verified).
            Game version: `${{ steps.patch.outputs.version_name }}`. Game version code: `${{ steps.patch.outputs.version_code }}`.
            APK package version remains the upstream value; a new patch tag alone does not guarantee Android detects an in-place update.
            Use the `.apk` asset with Obtainium's APK-only filter. The `.xapk` requires a split-capable installer.
            Local artifact checks do not prove an Android 16 device install or successful gameplay.

      - name: Prune superseded releases
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.patch.outputs.tag_name }}
        run: |
          gh release list --json tagName --limit 100 --jq '.[].tagName' | while IFS= read -r tag; do
            if [ "$tag" != "$CURRENT_TAG" ]; then
              if [[ "$tag" == "v1.2.1-patched" ]]; then
                gh release delete "$tag" --cleanup-tag --yes
              elif [[ "$tag" =~ ^0\.1(\.[1-9][0-9]*)?-beta$ ]]; then
                gh release delete "$tag" --yes
              fi
            fi
          done
