name: Patch and Release Hololive Dreams

on:
  workflow_dispatch:
    inputs:
      xapk_url:
        description: 'Optional direct XAPK URL (blank uses APKPure)'
        required: false
        default: ''
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: patch-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      tag: ${{ steps.patch.outputs.tag_name }}
      title: ${{ steps.patch.outputs.release_title }}
      game_version: ${{ steps.patch.outputs.version_name }}
      game_code: ${{ steps.patch.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK build tools
        run: |
          BT_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          for tool in zipalign apksigner aapt; do test -x "$BT_DIR/$tool"; done
          echo "$BT_DIR" >> "$GITHUB_PATH"
      - name: Select patch version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from scripts.patcher import get_apkpure_download_info

          releases = json.loads(subprocess.check_output(
              ['gh', 'release', 'list', '--json', 'tagName', '--limit', '100'], text=True))
          release_tags = [r['tagName'] for r in releases]
          tags = subprocess.check_output(['git', 'tag', '--list'], text=True).splitlines()
          version = '0.1-beta' if '0.1-beta' not in tags else (
              f"0.1.{max([0] + [int(m.group(1)) for t in tags if (m := re.fullmatch(r'0\.1\.(\d+)-beta', t))]) + 1}-beta")

          if os.environ['EVENT_NAME'] == 'schedule':
              _, _, game_code = get_apkpure_download_info()
              latest_tag = next((t for t in release_tags if re.fullmatch(r'0\.1(?:\.[1-9][0-9]*)?-beta', t)), None)
              latest_body = subprocess.check_output(
                  ['gh', 'release', 'view', latest_tag, '--json', 'body', '--jq', '.body'], text=True) if latest_tag else ''
              if f'Game version code: `{game_code}`' in latest_body:
                  print('No upstream game update; skipping scheduled build.')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write('skip=true\n')
                  raise SystemExit(0)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'patch_version={version}\n')
              f.write('skip=false\n')
          PY
      - name: Run verifier self-checks
        if: steps.version.outputs.skip != 'true'
        run: PYTHONPATH=. python3 tests/test_verify_apk.py
      - name: Build signed arm64 APK
        if: steps.version.outputs.skip != 'true'
        id: patch
        env:
          XAPK_URL: ${{ inputs.xapk_url }}
          PATCH_VERSION: ${{ steps.version.outputs.patch_version }}
        run: |
          args=()
          if [ -n "$XAPK_URL" ]; then args+=(--input "$XAPK_URL"); fi
          python3 scripts/patcher.py "${args[@]}" --patch-version "$PATCH_VERSION" \
            --keystore keystore/release.p12 --dist-dir dist
      - name: Verify standalone APK
        if: steps.version.outputs.skip != 'true'
        run: |
          apk=(dist/*.apk)
          test "${#apk[@]}" -eq 1
          python3 scripts/verify_apk.py "${apk[0]}" dist/work/extracted/manifest.json
      - name: Save APK for device test
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1

  android-install:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: [self-hosted, linux, ARM64, android16]
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate-apk
          path: candidate
      - name: Install and reinstall on dedicated Android 16 arm64 device
        shell: bash
        run: |
          set -euo pipefail
          command -v adb
          mapfile -t serials < <(adb devices | awk 'NR>1 && $2=="device" {print $1}')
          test "${#serials[@]}" -eq 1
          serial="${serials[0]}"
          sdk=$(adb -s "$serial" shell getprop ro.build.version.sdk | tr -d '\r')
          abi=$(adb -s "$serial" shell getprop ro.product.cpu.abi | tr -d '\r')
          test "$sdk" -ge 36
          test "$abi" = arm64-v8a
          package=game.qualiarts.hololive.dreams.com
          if adb -s "$serial" shell pm path "$package" | grep -q '^package:'; then
            echo 'Dedicated test device must start without this package' >&2
            exit 1
          fi
          apk=(candidate/*.apk)
          test "${#apk[@]}" -eq 1
          cleanup() { adb -s "$serial" uninstall "$package" || true; }
          trap cleanup EXIT
          adb -s "$serial" install "${apk[0]}"
          adb -s "$serial" shell pm path "$package" | grep -q '^package:'
          adb -s "$serial" install -r "${apk[0]}"
          adb -s "$serial" shell pm path "$package" | grep -q '^package:'
          echo 'Android 16 arm64 clean install and same-version reinstall passed.'

  publish:
    needs: [build, android-install]
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate-apk
          path: candidate
      - name: Publish APK-only release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          TITLE: ${{ needs.build.outputs.title }}
          GAME_VERSION: ${{ needs.build.outputs.game_version }}
          GAME_CODE: ${{ needs.build.outputs.game_code }}
        run: |
          set -euo pipefail
          apk=(candidate/*.apk)
          test "${#apk[@]}" -eq 1
          gh release create "$TAG" "${apk[0]}" --title "$TITLE" \
            --notes "Patch build $TAG (beta; gameplay not verified). Game version: $GAME_VERSION. Game version code: \`$GAME_CODE\`. Android 16 arm64 device clean install and same-version reinstall passed. APK version remains upstream."
      - name: Prune superseded patch releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release list --json tagName --limit 100 --jq '.[].tagName' | while IFS= read -r tag; do
            if [ "$tag" != "$CURRENT_TAG" ]; then
              if [[ "$tag" == "v1.2.1-patched" ]]; then
                gh release delete "$tag" --cleanup-tag --yes
              elif [[ "$tag" =~ ^0\.1(\.[1-9][0-9]*)?-beta$ ]]; then
                gh release delete "$tag" --yes
              fi
            fi
          done
