name: Patch and Release Hololive Dreams

on:
  workflow_dispatch:
    inputs:
      xapk_url:
        description: 'Optional direct XAPK URL (blank uses APKPure)'
        required: false
        default: ''
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: patch-release
  cancel-in-progress: false

jobs:
  patch-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK build tools
        run: |
          BT_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          for tool in zipalign apksigner aapt; do test -x "$BT_DIR/$tool"; done
          echo "$BT_DIR" >> "$GITHUB_PATH"
      - name: Select patch version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from scripts.patcher import get_apkpure_download_info

          _, game_ver, game_code = get_apkpure_download_info()
          releases = json.loads(subprocess.check_output(
              ['gh', 'release', 'list', '--json', 'tagName', '--limit', '100'], text=True))
          release_tags = [r['tagName'] for r in releases]
          tags = subprocess.check_output(['git', 'tag', '--list'], text=True).splitlines()

          all_tags = set(tags + release_tags)
          pattern = rf'^{re.escape(game_ver)}-patched-(\d+)$'
          revs = [int(m.group(1)) for t in all_tags if (m := re.fullmatch(pattern, t))]
          version = f"{game_ver}-patched-{max([0] + revs) + 1}"

          if os.environ['EVENT_NAME'] == 'schedule':
              latest_tag = next((t for t in release_tags if re.fullmatch(r'[0-9]+(?:\.[0-9]+)*-patched-[1-9][0-9]*', t)), None)
              if not latest_tag:
                  latest_tag = next((t for t in release_tags if re.fullmatch(r'0\.[1-9][0-9]*(?:\.[1-9][0-9]*)?-beta', t)), None)
              latest_body = subprocess.check_output(
                  ['gh', 'release', 'view', latest_tag, '--json', 'body', '--jq', '.body'], text=True) if latest_tag else ''
              if f'Game version code: `{game_code}`' in latest_body:
                  print('No upstream game update; skipping scheduled build.')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write('skip=true\n')
                  raise SystemExit(0)

          print(f'Selected patch version: {version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'patch_version={version}\n')
              f.write('skip=false\n')
          PY
      - name: Run verifier self-checks
        if: steps.version.outputs.skip != 'true'
        run: PYTHONPATH=. python3 tests/test_verify_apk.py
      - name: Build signed arm64 APK
        if: steps.version.outputs.skip != 'true'
        id: patch
        env:
          XAPK_URL: ${{ inputs.xapk_url }}
          PATCH_VERSION: ${{ steps.version.outputs.patch_version }}
        run: |
          args=()
          if [ -n "$XAPK_URL" ]; then args+=(--input "$XAPK_URL"); fi
          python3 scripts/patcher.py "${args[@]}" --patch-version "$PATCH_VERSION" \
            --keystore keystore/release.p12 --dist-dir dist
      - name: Verify standalone APK
        if: steps.version.outputs.skip != 'true'
        run: |
          apk=(dist/*.apk)
          test "${#apk[@]}" -eq 1
          python3 scripts/verify_apk.py "${apk[0]}" dist/work/extracted/manifest.json
      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.patch.outputs.tag_name }}
          TITLE: ${{ steps.patch.outputs.release_title }}
          GAME_VERSION: ${{ steps.patch.outputs.version_name }}
          GAME_CODE: ${{ steps.patch.outputs.version_code }}
        run: |
          set -euo pipefail
          apk=(dist/*.apk)
          test "${#apk[@]}" -eq 1
          gh release create "$TAG" "${apk[0]}" --title "$TITLE" \
            --notes "Patch build $TAG. Game version: $GAME_VERSION. Game version code: \`$GAME_CODE\`. Contains standalone arm64 APK with uncompressed resources.arsc (4-byte aligned), 16KiB page alignment, and v2/v3 signatures. Upstream package version remains intact."
      - name: Prune superseded patch releases
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_TAG: ${{ steps.patch.outputs.tag_name }}
        run: |
          gh release list --json tagName --limit 100 --jq '.[].tagName' | while IFS= read -r tag; do
            if [ "$tag" != "$CURRENT_TAG" ]; then
              if [[ "$tag" == "v1.2.1-patched" || "$tag" =~ ^0\.[1-9][0-9]*(\.[1-9][0-9]*)?-beta$ || "$tag" =~ ^[0-9]+(\.[0-9]+)*-patched-[0-9]+$ ]]; then
                gh release delete "$tag" --cleanup-tag --yes
              fi
            fi
          done
